<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MonClimat · galerie des fonds météo</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,900&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#e9e5ff;color:#2b1b6b;font:14px/1.4 Nunito,sans-serif}
.w{max-width:900px;margin:0 auto;padding:18px 14px 40px}
h1{font:900 28px Fraunces,serif;margin:0 0 4px}p{color:#7a73a8;margin:0 0 14px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
figure{margin:0;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 8px 18px #2b1b6b26}
figure .z{position:relative;aspect-ratio:300/232}figure svg{position:absolute;inset:0;width:100%;height:100%}
figcaption{padding:6px 10px 8px;font-weight:800;font-size:13px}figcaption small{display:block;font-weight:600;color:#7a73a8;font-size:11px}
</style></head>
<body><div class="w"><h1>Fonds météo</h1><p>Un fond par icône de la page Infos, avec un paysage différent d'un fond à l'autre. Sert de référence pour la page Météo.</p><div class="g" id="g"></div></div>
<script type="module">
import {ICONES} from "./modules/icones.js";
import {decor, PAYSAGES} from "./modules/decors.js";
document.getElementById("g").innerHTML = Object.entries(ICONES).map(([k, v], i) => {
  const p = PAYSAGES[i % PAYSAGES.length], d = decor(k, {paysage: p});
  return `<figure><div class="z">${d.svg}</div><figcaption>${v.nom}<small>paysage : ${p}</small></figcaption></figure>`;
}).join("");
</script></body></html>
